name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve bun version from packageManager
        id: bun
        # The pin lives in package.json; the workflow never hardcodes it
        # twice. The class admits prerelease suffixes (1.3.14-beta.1) that a
        # digits-only match would drop; an empty extraction fails the step.
        run: |
          version="$(sed -n 's/.*"packageManager": "bun@\([0-9A-Za-z.+-]*\)".*/\1/p' package.json)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: make check
